<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Code YNA</title>
        <link rel="stylesheet" href="fontawesome-free-7.1.0-web/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="node_modules/normalize.css/normalize.css" />
        <link rel="stylesheet" href="css/master.css" />
    </head>
    <body>
        <!-- Start Settings Box -->
         <div class="settings-box">
            <div class="setting-box-icon">
                <i class="setting-icon fa-solid fa-sliders fa-flip"></i>
            </div>
            <div class="setting-container">
                <h3>Testing Options</h3>
                <h4>Colors</h4>
                <div class="setting-option">
                    <ul class="color-list">
                        <li class="active" data-color="#0A2540"></li>
                        <li data-color="#ff6347"></li>
                        <li data-color="#0000ff"></li>
                    </ul>
                </div>
            </div>
         </div>
        <!-- End Settings Box -->

        <!-- Start Landing Page -->
        <div class="landing-page">
            <div class="overlay"></div>
            <header>
                <div class="logo">
                    <svg
                        width="160"
                        height="60"
                        viewBox="0 0 160 60"
                        xmlns="http://www.w3.org/2000/svg">
                        <rect
                            x="0"
                            y="0"
                            width="40"
                            height="40"
                            rx="8"
                            fill="#0A2540" />
                        <text
                            x="12"
                            y="26"
                            font-size="18"
                            fill="#00B4D8"
                            font-family="Arial">
                            { }
                        </text>
                        <text
                            x="50"
                            y="26"
                            font-size="18"
                            fill="#0A2540"
                            font-family="Arial"
                            font-weight="bold">
                            Code YNA
                        </text>
                    </svg>
                </div>
                <nav>
                    <ul>
                        <li><a href="">Home</a></li>
                        <li><a href="">Service</a></li>
                        <li><a href="">Products</a></li>
                        <li><a href="">Contact</a></li>
                        <li><a href="">About</a></li>
                    </ul>
                </nav>
            </header>
            <div class="introduction-text">
                <h1>We Are <span id="headerSpan">Creative</span> Agency</h1>
                <p>
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit
                    quod vitae vel magni quia dolorem minus!
                </p>
            </div>
        </div>
        <!-- End Landing Page -->

        <script src="js/master.js"></script>
        <script src="js/designEffect.js"></script>
    </body>
</html>
