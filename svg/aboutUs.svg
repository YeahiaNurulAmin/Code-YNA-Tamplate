<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background blob -->
  <path d="M150 50 Q250 30 400 80 T650 150 Q700 250 650 350 T500 500 Q350 550 200 480 T100 250 Q80 150 150 50 Z" fill="#4DD0E1" opacity="0.3"/>
  <path d="M500 30 Q600 40 680 120 T720 280 Q710 380 620 430 T480 450 Q420 440 400 400" fill="#3F51B5" opacity="0.2"/>
  
  <!-- Plant decoration left -->
  <g transform="translate(80, 350)">
    <ellipse cx="30" cy="60" rx="35" ry="15" fill="#4DD0E1" opacity="0.3"/>
    <path d="M30 60 Q20 45 25 30 Q30 20 35 30 Q40 45 30 60" fill="#26C6DA"/>
    <path d="M30 60 Q35 45 45 35 Q50 30 50 38 Q48 50 30 60" fill="#26C6DA"/>
    <path d="M30 60 Q25 50 20 42 Q18 38 22 38 Q28 42 30 60" fill="#00BCD4"/>
  </g>
  
  <!-- Large laptop -->
  <g transform="translate(200, 200)">
    <!-- Laptop base -->
    <rect x="0" y="200" width="450" height="15" rx="5" fill="#283593"/>
    <path d="M-20 215 L470 215 L450 230 L0 230 Z" fill="#1A237E"/>
    
    <!-- Laptop screen -->
    <rect x="20" y="0" width="410" height="200" rx="5" fill="#1A237E"/>
    <rect x="30" y="10" width="390" height="180" rx="3" fill="#E3F2FD"/>
    
    <!-- Browser window 1 -->
    <g transform="translate(45, 25)">
      <rect width="160" height="150" rx="5" fill="white" stroke="#3F51B5" stroke-width="2"/>
      <rect y="0" width="160" height="25" rx="5" fill="#3F51B5"/>
      <circle cx="10" cy="12" r="3" fill="#E3F2FD"/>
      <circle cx="20" cy="12" r="3" fill="#E3F2FD"/>
      <circle cx="30" cy="12" r="3" fill="#E3F2FD"/>
      
      <!-- Content boxes -->
      <rect x="15" y="40" width="40" height="40" rx="5" fill="#4DD0E1"/>
      <rect x="65" y="40" width="80" height="8" rx="2" fill="#B0BEC5"/>
      <rect x="65" y="55" width="80" height="8" rx="2" fill="#B0BEC5"/>
      <rect x="65" y="70" width="60" height="8" rx="2" fill="#B0BEC5"/>
      
      <rect x="15" y="95" width="130" height="8" rx="2" fill="#B0BEC5"/>
      <rect x="15" y="108" width="130" height="8" rx="2" fill="#B0BEC5"/>
      <rect x="15" y="121" width="100" height="8" rx="2" fill="#B0BEC5"/>
    </g>
    
    <!-- Mobile phone mockup -->
    <g transform="translate(225, 35)">
      <rect width="70" height="130" rx="8" fill="white" stroke="#3F51B5" stroke-width="2"/>
      <rect x="5" y="15" width="60" height="100" rx="3" fill="#E3F2FD"/>
      <circle cx="35" cy="120" r="5" fill="#3F51B5"/>
      
      <!-- Phone content -->
      <rect x="15" y="25" width="40" height="6" rx="2" fill="#B0BEC5"/>
      <rect x="15" y="38" width="40" height="25" rx="3" fill="#4DD0E1"/>
      <rect x="15" y="70" width="40" height="6" rx="2" fill="#B0BEC5"/>
      <rect x="15" y="82" width="30" height="6" rx="2" fill="#B0BEC5"/>
    </g>
    
    <!-- Browser window 2 -->
    <g transform="translate(310, 25)">
      <rect width="100" height="150" rx="5" fill="white" stroke="#7C4DFF" stroke-width="2"/>
      <rect y="0" width="100" height="25" rx="5" fill="#7C4DFF"/>
      <circle cx="10" cy="12" r="3" fill="#E3F2FD"/>
      <circle cx="20" cy="12" r="3" fill="#E3F2FD"/>
      <circle cx="30" cy="12" r="3" fill="#E3F2FD"/>
      
      <!-- HTML tag -->
      <rect x="10" y="40" width="80" height="30" rx="5" fill="#7C4DFF"/>
      <text x="50" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">HTML</text>
      
      <!-- Code symbol -->
      <text x="50" y="95" text-anchor="middle" fill="#3F51B5" font-family="monospace" font-size="24">&lt;/&gt;</text>
      
      <!-- CSS tag -->
      <rect x="10" y="110" width="80" height="30" rx="5" fill="#7C4DFF"/>
      <text x="50" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">CSS</text>
    </g>
    
    <!-- Keyboard -->
    <g transform="translate(30, 190)">
      <rect x="0" y="0" width="390" height="3" fill="#E3F2FD" opacity="0.5"/>
      <rect x="10" y="5" width="370" height="2" fill="#E3F2FD" opacity="0.5"/>
    </g>
  </g>
  
  <!-- Developer 1 (standing, working on code) -->
  <g transform="translate(380, 280)">
    <!-- Body -->
    <ellipse cx="0" cy="70" rx="25" ry="35" fill="#1A237E"/>
    <!-- Head -->
    <circle cx="0" cy="20" r="18" fill="#FFD8B8"/>
    <!-- Hair -->
    <path d="M-15 15 Q-18 5 -10 0 Q0 -5 10 0 Q18 5 15 15" fill="#1A237E"/>
    <!-- Arms -->
    <path d="M-20 50 Q-35 45 -40 55 L-30 60 Q-25 55 -20 55" fill="#FFD8B8"/>
    <path d="M20 50 Q40 40 50 35" stroke="#FFD8B8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Legs -->
    <rect x="-12" y="100" width="10" height="35" fill="#283593"/>
    <rect x="2" y="100" width="10" height="35" fill="#283593"/>
    <ellipse cx="-7" cy="138" rx="8" ry="4" fill="#1A237E"/>
    <ellipse cx="7" cy="138" rx="8" ry="4" fill="#1A237E"/>
  </g>
  
  <!-- Developer 2 (sitting with laptop) -->
  <g transform="translate(620, 340)">
    <!-- Chair -->
    <ellipse cx="0" cy="80" rx="40" ry="20" fill="#1A237E" opacity="0.7"/>
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="30" ry="40" fill="#7C4DFF"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#FFD8B8"/>
    <!-- Hair -->
    <path d="M-18 -5 Q-20 -15 -10 -18 Q0 -20 10 -18 Q20 -15 18 -5 L15 5 Q10 8 0 8 Q-10 8 -15 5 Z" fill="#1A237E"/>
    <!-- Arms -->
    <path d="M-25 35 Q-35 45 -30 55" stroke="#FFD8B8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M25 35 Q35 45 30 55" stroke="#FFD8B8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Laptop -->
    <rect x="-35" y="50" width="70" height="35" rx="3" fill="#3F51B5"/>
    <rect x="-30" y="55" width="60" height="25" rx="2" fill="#E3F2FD"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="120" cy="150" r="8" fill="#4DD0E1" opacity="0.5"/>
  <circle cx="150" cy="180" r="5" fill="#7C4DFF" opacity="0.5"/>
  <circle cx="700" cy="200" r="10" fill="#4DD0E1" opacity="0.4"/>
  <circle cx="730" cy="250" r="6" fill="#7C4DFF" opacity="0.4"/>
</svg>