<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#eff6ff"/>
  
  <!-- Cloud -->
  <g transform="translate(100, 85)">
    <ellipse cx="-25" cy="0" rx="25" ry="20" fill="url(#cloudGrad)"/>
    <ellipse cx="0" cy="-8" rx="30" ry="25" fill="url(#cloudGrad)"/>
    <ellipse cx="25" cy="0" rx="25" ry="20" fill="url(#cloudGrad)"/>
    <rect x="-25" y="0" width="50" height="20" fill="url(#cloudGrad)"/>
  </g>
  
  <!-- Upload arrow -->
  <g transform="translate(100, 130)">
    <line x1="0" y1="15" x2="0" y2="-5" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0,-5 L -8,3 M 0,-5 L 8,3" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>