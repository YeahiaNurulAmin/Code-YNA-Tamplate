<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="integrationGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0fdfa"/>
  
  <!-- Center hub -->
  <circle cx="100" cy="100" r="20" fill="url(#integrationGrad)"/>
  
  <!-- Connected nodes -->
  <!-- Top -->
  <circle cx="100" cy="50" r="15" fill="url(#integrationGrad)" opacity="0.8"/>
  <line x1="100" y1="80" x2="100" y2="65" stroke="#5eead4" stroke-width="4"/>
  
  <!-- Top Right -->
  <circle cx="143" cy="70" r="15" fill="url(#integrationGrad)" opacity="0.8"/>
  <line x1="115" y1="88" x2="130" y2="78" stroke="#5eead4" stroke-width="4"/>
  
  <!-- Bottom Right -->
  <circle cx="143" cy="130" r="15" fill="url(#integrationGrad)" opacity="0.8"/>
  <line x1="115" y1="112" x2="130" y2="122" stroke="#5eead4" stroke-width="4"/>
  
  <!-- Bottom -->
  <circle cx="100" cy="150" r="15" fill="url(#integrationGrad)" opacity="0.8"/>
  <line x1="100" y1="120" x2="100" y2="135" stroke="#5eead4" stroke-width="4"/>
  
  <!-- Bottom Left -->
  <circle cx="57" cy="130" r="15" fill="url(#integrationGrad)" opacity="0.8"/>
  <line x1="85" y1="112" x2="70" y2="122" stroke="#5eead4" stroke-width="4"/>
  
  <!-- Top Left -->
  <circle cx="57" cy="70" r="15" fill="url(#integrationGrad)" opacity="0.8"/>
  <line x1="85" y1="88" x2="70" y2="78" stroke="#5eead4" stroke-width="4"/>
  
  <!-- Pulse animation on center -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#5eead4" stroke-width="2">
    <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>