<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#fdf2f8"/>
  
  <!-- Phone -->
  <rect x="70" y="50" width="60" height="100" rx="8" fill="url(#phoneGrad)" stroke="#9d174d" stroke-width="3"/>
  
  <!-- Phone screen -->
  <rect x="77" y="60" width="46" height="70" rx="3" fill="#ffffff"/>
  
  <!-- Screen content (app icons) -->
  <rect x="82" y="65" width="12" height="12" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="97" y="65" width="12" height="12" rx="2" fill="#10b981" opacity="0.7"/>
  <rect x="112" y="65" width="12" height="12" rx="2" fill="#f59e0b" opacity="0.7"/>
  
  <rect x="82" y="80" width="12" height="12" rx="2" fill="#8b5cf6" opacity="0.7"/>
  <rect x="97" y="80" width="12" height="12" rx="2" fill="#ef4444" opacity="0.7"/>
  <rect x="112" y="80" width="12" height="12" rx="2" fill="#06b6d4" opacity="0.7"/>
  
  <!-- Bottom bar -->
  <rect x="82" y="95" width="36" height="25" rx="2" fill="#e5e7eb"/>
  <line x1="87" y1="102" x2="113" y2="102" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="87" y1="108" x2="113" y2="108" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <line x1="87" y1="114" x2="103" y2="114" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Home button -->
  <circle cx="100" cy="140" r="5" fill="#ffffff" stroke="#9d174d" stroke-width="2"/>
  
  <!-- Signal waves -->
  <path d="M 130,70 Q 135,75 130,80" stroke="#f9a8d4" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 135,68 Q 142,75 135,82" stroke="#f9a8d4" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 140,66 Q 149,75 140,84" stroke="#f9a8d4" stroke-width="2" fill="none" opacity="0.4"/>
</svg>