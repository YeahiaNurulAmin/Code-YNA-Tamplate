<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0fdf4"/>
  
  <!-- Server stacks growing in size -->
  <!-- Small server -->
  <g>
    <rect x="50" y="120" width="30" height="20" rx="3" fill="url(#scaleGrad)"/>
    <line x1="55" y1="127" x2="75" y2="127" stroke="#86efac" stroke-width="2"/>
    <line x1="55" y1="133" x2="70" y2="133" stroke="#86efac" stroke-width="2"/>
    <circle cx="73" cy="133" r="2" fill="#dcfce7"/>
  </g>
  
  <!-- Medium server -->
  <g>
    <rect x="60" y="90" width="40" height="25" rx="3" fill="url(#scaleGrad)"/>
    <line x1="66" y1="99" x2="94" y2="99" stroke="#86efac" stroke-width="2"/>
    <line x1="66" y1="106" x2="88" y2="106" stroke="#86efac" stroke-width="2"/>
    <circle cx="92" cy="106" r="2.5" fill="#dcfce7"/>
  </g>
  
  <!-- Large server -->
  <g>
    <rect x="70" y="55" width="50" height="30" rx="3" fill="url(#scaleGrad)"/>
    <line x1="77" y1="66" x2="113" y2="66" stroke="#86efac" stroke-width="2"/>
    <line x1="77" y1="74" x2="107" y2="74" stroke="#86efac" stroke-width="2"/>
    <circle cx="111" cy="74" r="3" fill="#dcfce7"/>
  </g>
  
  <!-- Upward arrow -->
  <g>
    <line x1="140" y1="130" x2="140" y2="70" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <path d="M 140,70 L 130,85 M 140,70 L 150,85" 
          stroke="#22c55e" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Growth chart line -->
  <path d="M 35,140 L 50,120 L 70,95 L 95,70" 
        stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Dots on chart line -->
  <circle cx="50" cy="120" r="4" fill="#16a34a"/>
  <circle cx="70" cy="95" r="4" fill="#16a34a"/>
  <circle cx="95" cy="70" r="4" fill="#16a34a"/>
  
  <!-- Plus signs indicating expansion -->
  <g opacity="0.6">
    <path d="M 145,95 L 155,95 M 150,90 L 150,100" 
          stroke="#86efac" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 160,115 L 168,115 M 164,111 L 164,119" 
          stroke="#86efac" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>