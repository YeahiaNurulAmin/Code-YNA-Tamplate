<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <circle cx="400" cy="300" r="180" fill="#E3F2FD" opacity="0.4"/>
  <circle cx="400" cy="300" r="140" fill="#C5CAE9" opacity="0.3"/>
  
  <!-- Decorative background shapes -->
  <path d="M100 150 Q150 120 200 150 T300 150" stroke="#4DD0E1" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M500 450 Q550 420 600 450 T700 450" stroke="#7C4DFF" stroke-width="3" fill="none" opacity="0.3"/>
  <circle cx="120" cy="400" r="6" fill="#4DD0E1" opacity="0.5"/>
  <circle cx="680" cy="180" r="8" fill="#7C4DFF" opacity="0.5"/>
  <circle cx="150" cy="500" r="5" fill="#FF6B9D" opacity="0.5"/>
  <circle cx="720" cy="350" r="7" fill="#FFB74D" opacity="0.5"/>
  
  <!-- Center person -->
  <g transform="translate(400, 280)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="35" ry="50" fill="#3F51B5"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="25" fill="#FFD8B8"/>
    <!-- Hair -->
    <path d="M-22 -15 Q-25 -25 -15 -32 Q0 -35 15 -32 Q25 -25 22 -15 L18 -5 Q12 0 0 0 Q-12 0 -18 -5 Z" fill="#1A237E"/>
    <!-- Arms -->
    <ellipse cx="-40" cy="45" rx="12" ry="35" fill="#3F51B5" transform="rotate(-20 -40 45)"/>
    <ellipse cx="40" cy="45" rx="12" ry="35" fill="#3F51B5" transform="rotate(20 40 45)"/>
    <!-- Legs -->
    <rect x="-15" y="85" width="12" height="40" rx="6" fill="#283593"/>
    <rect x="3" y="85" width="12" height="40" rx="6" fill="#283593"/>
  </g>
  
  <!-- Skill 1: Code/Development (top left) -->
  <g transform="translate(220, 150)">
    <circle cx="0" cy="0" r="45" fill="#7C4DFF" opacity="0.9"/>
    <path d="M-20 -5 L-10 0 L-20 5" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M20 -5 L10 0 L20 5" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="-5" y1="-8" x2="5" y2="8" stroke="white" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Skill 2: Design/Creativity (top right) -->
  <g transform="translate(580, 150)">
    <circle cx="0" cy="0" r="45" fill="#FF6B9D" opacity="0.9"/>
    <path d="M-15 10 Q-15 -5 -5 -15 Q5 -15 10 -10 Q15 -5 15 5 Q15 15 5 20 L0 15 L-5 20 Q-15 15 -15 10 Z" fill="white"/>
    <rect x="-3" y="12" width="6" height="15" fill="white"/>
    <circle cx="-5" cy="-8" r="3" fill="#FFE082"/>
  </g>
  
  <!-- Skill 3: Communication (left) -->
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="45" fill="#4DD0E1" opacity="0.9"/>
    <circle cx="-10" cy="-8" r="12" fill="white"/>
    <circle cx="10" cy="-8" r="12" fill="white"/>
    <path d="M-18 5 Q0 15 18 5" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Skill 4: Analytics/Data (right) -->
  <g transform="translate(650, 300)">
    <circle cx="0" cy="0" r="45" fill="#FFB74D" opacity="0.9"/>
    <rect x="-20" y="8" width="10" height="15" rx="2" fill="white"/>
    <rect x="-5" y="-2" width="10" height="25" rx="2" fill="white"/>
    <rect x="10" y="-12" width="10" height="35" rx="2" fill="white"/>
    <line x1="-25" y1="25" x2="25" y2="25" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Skill 5: Problem Solving (bottom left) -->
  <g transform="translate(220, 450)">
    <circle cx="0" cy="0" r="45" fill="#26A69A" opacity="0.9"/>
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="-8" cy="-8" r="3" fill="white"/>
    <circle cx="8" cy="-8" r="3" fill="white"/>
    <circle cx="-8" cy="8" r="3" fill="white"/>
    <circle cx="8" cy="8" r="3" fill="white"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="white" stroke-width="3"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="white" stroke-width="3"/>
  </g>
  
  <!-- Skill 6: Collaboration/Team (bottom right) -->
  <g transform="translate(580, 450)">
    <circle cx="0" cy="0" r="45" fill="#AB47BC" opacity="0.9"/>
    <circle cx="-12" cy="-5" r="8" fill="white"/>
    <circle cx="12" cy="-5" r="8" fill="white"/>
    <circle cx="0" cy="8" r="8" fill="white"/>
    <ellipse cx="-12" cy="8" rx="10" ry="14" fill="white" opacity="0.7"/>
    <ellipse cx="12" cy="8" rx="10" ry="14" fill="white" opacity="0.7"/>
    <ellipse cx="0" cy="20" rx="10" ry="14" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Connecting lines from person to skills -->
  <line x1="400" y1="280" x2="220" y2="150" stroke="#7C4DFF" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="280" x2="580" y2="150" stroke="#FF6B9D" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="280" x2="150" y2="300" stroke="#4DD0E1" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="280" x2="650" y2="300" stroke="#FFB74D" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="280" x2="220" y2="450" stroke="#26A69A" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  <line x1="400" y1="280" x2="580" y2="450" stroke="#AB47BC" stroke-width="2" opacity="0.3" stroke-dasharray="5,5"/>
  
  <!-- Additional decorative elements -->
  <circle cx="400" cy="280" r="95" fill="none" stroke="#3F51B5" stroke-width="2" opacity="0.2" stroke-dasharray="10,5"/>
  <circle cx="400" cy="280" r="220" fill="none" stroke="#7C4DFF" stroke-width="2" opacity="0.15" stroke-dasharray="15,10"/>
</svg>