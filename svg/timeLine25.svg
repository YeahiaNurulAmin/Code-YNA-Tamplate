<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient2025" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="globeGlow">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient2025)"/>
  
  <!-- Stars in background -->
  <circle cx="100" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="80" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="200" cy="60" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="650" cy="70" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="700" cy="100" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="750" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="250" cy="350" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="600" cy="340" r="1.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- Globe glow -->
  <circle cx="400" cy="200" r="150" fill="url(#globeGlow)"/>
  
  <!-- Globe -->
  <circle cx="400" cy="200" r="120" fill="#3730a3" stroke="#6366f1" stroke-width="3"/>
  
  <!-- Continents (simplified) -->
  <g fill="#6366f1" opacity="0.8">
    <!-- North America -->
    <path d="M 340,160 Q 320,150 310,170 L 315,185 Q 330,180 340,190 L 350,175 Z"/>
    
    <!-- South America -->
    <path d="M 350,210 L 345,240 Q 350,250 360,245 L 365,220 Z"/>
    
    <!-- Europe -->
    <path d="M 400,150 L 395,165 L 405,170 L 410,160 Z"/>
    
    <!-- Africa -->
    <path d="M 410,180 Q 405,200 410,220 Q 420,225 425,210 L 420,185 Z"/>
    
    <!-- Asia -->
    <path d="M 450,160 Q 460,150 475,155 L 480,175 Q 470,185 455,180 Z"/>
    
    <!-- Australia -->
    <ellipse cx="480" cy="230" rx="15" ry="10"/>
  </g>
  
  <!-- Latitude/Longitude lines -->
  <g stroke="#8b5cf6" stroke-width="1" opacity="0.3" fill="none">
    <ellipse cx="400" cy="200" rx="120" ry="40"/>
    <ellipse cx="400" cy="200" rx="120" ry="80"/>
    <line x1="280" y1="200" x2="520" y2="200"/>
    <path d="M 400,80 Q 380,200 400,320"/>
    <path d="M 400,80 Q 420,200 400,320"/>
  </g>
  
  <!-- Connection lines from different continents -->
  <g stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 330,175 Q 400,150 470,170">
      <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 355,230 Q 400,250 480,230">
      <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 415,200 Q 450,180 470,170">
      <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Location pins -->
  <g>
    <!-- Pin 1 -->
    <circle cx="330" cy="175" r="5" fill="#fbbf24">
      <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="175" r="8" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="8;15;8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Pin 2 -->
    <circle cx="415" cy="200" r="5" fill="#fbbf24">
      <animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="415" cy="200" r="8" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="8;15;8" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Pin 3 -->
    <circle cx="470" cy="170" r="5" fill="#fbbf24">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="170" r="8" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Pin 4 -->
    <circle cx="355" cy="230" r="5" fill="#fbbf24">
      <animate attributeName="r" values="5;7;5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="355" cy="230" r="8" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="8;15;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Pin 5 -->
    <circle cx="480" cy="230" r="5" fill="#fbbf24">
      <animate attributeName="r" values="5;7;5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="230" r="8" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="8;15;8" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Bottom text -->
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Expanded to 50+ Countries
  </text>
</svg>