<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient2026" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be123c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coinGlow">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient2026)"/>
  
  <!-- Sparkles -->
  <g fill="#fef3c7">
    <path d="M 150,100 L 153,108 L 161,111 L 153,114 L 150,122 L 147,114 L 139,111 L 147,108 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 650,120 L 653,128 L 661,131 L 653,134 L 650,142 L 647,134 L 639,131 L 647,128 Z">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 200,300 L 202,306 L 208,308 L 202,310 L 200,316 L 198,310 L 192,308 L 198,306 Z">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 600,280 L 602,286 L 608,288 L 602,290 L 600,296 L 598,290 L 592,288 L 598,286 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Main coin glow -->
  <circle cx="400" cy="180" r="120" fill="url(#coinGlow)"/>
  
  <!-- Main large coin -->
  <g>
    <ellipse cx="400" cy="180" rx="90" ry="90" fill="url(#coinGradient)" stroke="#d97706" stroke-width="4"/>
    <ellipse cx="400" cy="180" rx="75" ry="75" fill="none" stroke="#f59e0b" stroke-width="3"/>
    
    <!-- Dollar sign on coin -->
    <text x="400" y="210" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#78350f" text-anchor="middle">$</text>
    
    <!-- Coin shine -->
    <ellipse cx="370" cy="150" rx="25" ry="40" fill="#fef3c7" opacity="0.4"/>
  </g>
  
  <!-- Floating coins around main coin -->
  <g>
    <!-- Coin 1 -->
    <ellipse cx="250" cy="150" rx="35" ry="35" fill="url(#coinGradient)" stroke="#d97706" stroke-width="2">
      <animate attributeName="cy" values="150;140;150" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <text x="250" y="160" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#78350f" text-anchor="middle">
      $
      <animate attributeName="y" values="160;150;160" dur="2s" repeatCount="indefinite"/>
    </text>
    
    <!-- Coin 2 -->
    <ellipse cx="550" cy="140" rx="40" ry="40" fill="url(#coinGradient)" stroke="#d97706" stroke-width="2">
      <animate attributeName="cy" values="140;130;140" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
    <text x="550" y="152" font-family="Arial, sans-serif" font-size="35" font-weight="bold" fill="#78350f" text-anchor="middle">
      $
      <animate attributeName="y" values="152;142;152" dur="2.5s" repeatCount="indefinite"/>
    </text>
    
    <!-- Coin 3 -->
    <ellipse cx="300" cy="240" rx="30" ry="30" fill="url(#coinGradient)" stroke="#d97706" stroke-width="2">
      <animate attributeName="cy" values="240;250;240" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
    <text x="300" y="250" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#78350f" text-anchor="middle">
      $
      <animate attributeName="y" values="250;260;250" dur="1.8s" repeatCount="indefinite"/>
    </text>
    
    <!-- Coin 4 -->
    <ellipse cx="520" cy="230" rx="32" ry="32" fill="url(#coinGradient)" stroke="#d97706" stroke-width="2">
      <animate attributeName="cy" values="230;240;230" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    <text x="520" y="241" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#78350f" text-anchor="middle">
      $
      <animate attributeName="y" values="241;251;241" dur="2.2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Upward arrow behind coin -->
  <g opacity="0.6">
    <path d="M 400,280 L 400,320" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <path d="M 400,280 L 385,295 M 400,280 L 415,295" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Money rain effect -->
  <g fill="#fbbf24" opacity="0.5">
    <rect x="180" y="50" width="6" height="15" rx="3">
      <animate attributeName="y" values="50;350" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="320" y="30" width="6" height="15" rx="3">
      <animate attributeName="y" values="30;350" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="40" width="6" height="15" rx="3">
      <animate attributeName="y" values="40;350" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="620" y="60" width="6" height="15" rx="3">
      <animate attributeName="y" values="60;350" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Bottom text -->
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Raised $50M Series B
  </text>
</svg>