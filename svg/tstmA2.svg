<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg3)"/>
  
  <!-- Face -->
  <circle cx="100" cy="85" r="35" fill="#fde68a"/>
  
  <!-- Hair (short/wavy) -->
  <path d="M 67,75 Q 65,55 75,50 Q 85,45 95,50 Q 100,43 105,50 Q 115,45 125,50 Q 135,55 133,75" 
        fill="#451a03"/>
  
  <!-- Hair texture -->
  <path d="M 70,60 Q 75,55 80,60 M 85,55 Q 90,50 95,55 M 100,52 Q 105,48 110,52 M 115,55 Q 120,50 125,55" 
        stroke="#78350f" stroke-width="1.5" fill="none"/>
  
  <!-- Glasses -->
  <g stroke="#1e293b" stroke-width="3" fill="none">
    <circle cx="88" cy="82" r="10"/>
    <circle cx="112" cy="82" r="10"/>
    <line x1="98" y1="82" x2="102" y2="82"/>
    <line x1="78" y1="82" x2="70" y2="80"/>
    <line x1="122" y1="82" x2="130" y2="80"/>
  </g>
  
  <!-- Eyes behind glasses -->
  <circle cx="88" cy="82" r="3" fill="#1e293b"/>
  <circle cx="112" cy="82" r="3" fill="#1e293b"/>
  
  <!-- Smile -->
  <path d="M 85,95 Q 100,103 115,95" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Body/Shoulders -->
  <ellipse cx="100" cy="165" rx="60" ry="45" fill="#92400e"/>
  
  <!-- Shirt collar -->
  <path d="M 75,140 L 70,155 L 85,150 L 100,155 L 115,150 L 130,155 L 125,140" 
        fill="#b45309" stroke="#78350f" stroke-width="2"/>
</svg>