<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg4)"/>
  
  <!-- Face -->
  <circle cx="100" cy="85" r="35" fill="#fcd34d"/>
  
  <!-- Hair (bald/short) -->
  <path d="M 70,70 Q 68,55 80,50 Q 90,47 100,47 Q 110,47 120,50 Q 132,55 130,70" 
        fill="#451a03"/>
  
  <!-- Facial hair (beard) -->
  <path d="M 75,95 Q 75,108 85,112 Q 92,115 100,115 Q 108,115 115,112 Q 125,108 125,95" 
        fill="#451a03"/>
  
  <!-- Eyes -->
  <circle cx="88" cy="82" r="3" fill="#1e293b"/>
  <circle cx="112" cy="82" r="3" fill="#1e293b"/>
  
  <!-- Eyebrows -->
  <path d="M 80,75 Q 88,73 95,75" stroke="#451a03" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 105,75 Q 112,73 120,75" stroke="#451a03" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M 88,97 Q 100,102 112,97" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Body/Shoulders -->
  <ellipse cx="100" cy="165" rx="60" ry="45" fill="#5b21b6"/>
  
  <!-- Tie -->
  <path d="M 95,130 L 100,155 L 105,130 Z" fill="#7c3aed"/>
